<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CaloriFit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2 class="text-center">Criar Conta</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="text" name="nome" placeholder="Seu Nome" required>
                <input type="email" name="email" placeholder="Seu E-mail" required>
                <input type="password" name="senha" placeholder="Sua Senha" required>
                
                <div class="grid grid-2">
                    <input type="number" name="idade" placeholder="Idade" required>
                    <select name="sexo" required>
                        <option value="" disabled selected>Sexo</option>
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                    </select>
                </div>
                <div class="grid grid-2">
                    <input type="number" step="0.1" name="peso" placeholder="Peso (kg)" required>
                    <input type="number" step="0.1" name="altura" placeholder="Altura (cm)" required>
                </div>
                
                <select name="objetivo" required>
                    <option value="" disabled selected>Qual o seu objetivo?</option>
                    <option value="Emagrecer">Emagrecer</option>
                    <option value="Ganhar Massa Muscular">Ganhar Massa Muscular</option>
                    <option value="Manter o Peso">Manter o Peso</option>
                    <option value="Bem-estar e Saúde">Bem-estar e Saúde</option>
                </select>
                
                <textarea name="anotacoes" placeholder="Conte-nos seu propósito..." style="height: 80px;"></textarea>

                <button type="submit" class="btn btn-primary mt-4">Cadastrar</button>
            </form>
            <div class="text-center mt-4">
                <a href="/login" style="color: var(--text-muted);">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>
</body>
</html>
