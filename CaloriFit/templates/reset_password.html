<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .auth-container h2 { margin-top: 0; color: #38bdf8; font-size: 1.5em; }
        p { color: #cbd5e1; font-size: 0.9em; margin-bottom: 20px;}
        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 6px; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        .flash { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .flash.error { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Redefinir Senha</h2>
        <p>Insira sua nova senha abaixo.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="password" name="senha" placeholder="Nova Senha" required>
            <input type="password" name="confirmar_senha" placeholder="Confirmar Nova Senha" required>
            <button type="submit">Redefinir Senha</button>
        </form>
    </div>
</body>
</html>
