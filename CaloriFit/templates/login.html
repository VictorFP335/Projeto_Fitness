<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CaloriFit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2 class="text-center">Entrar no CaloriFit</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="email" name="email" placeholder="Seu E-mail" required>
                <input type="password" name="senha" placeholder="Sua Senha" required>
                <button type="submit" class="btn btn-primary mt-4">Entrar</button>
            </form>
            <div class="text-center mt-4">
                <a href="/register" style="color: var(--text-muted); display: block; margin-bottom: 10px;">Ainda não tem conta? Crie uma aqui</a>
                <a href="/forgot_password" style="color: var(--text-muted);">Esqueceu a senha?</a>
            </div>
        </div>
    </div>
</body>
</html>
